services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: mkulima-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mkulima
      POSTGRES_PASSWORD: mkulima
      POSTGRES_DB: mkulima
    ports:
      - '5432:5432'
    volumes:
      - mkulima_db_data:/var/lib/postgresql/data

volumes:
  mkulima_db_data:
